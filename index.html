<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARTELEADOS</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="terminal-container unified-view">
        <header class="terminal-header">
            <div class="system-status">ESTADO: 🟢 ONLINE</div>
            <h1>ANDRIUX 🕵️ CARTELEADOS</h1>
        </header>

        <main class="terminal-body">
            <section class="preview-section fully-wide">
                <h2>[ SINCRONIZADO ]</h2>
                <div class="records-list" id="records-container"></div>
            </section>
        </main>
    </div>

    <div id="view-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2>[ VISUALIZACIÓN DE EXPEDIENTE ]</h2>
            <div id="modal-data-container"></div>
        </div>
    </div>

    <div id="print-poster-target" class="poster-preview"></div>

    <script src="publico.js"></script>
</body>
</html>
